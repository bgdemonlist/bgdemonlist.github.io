<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG Demon Roulette</title>
    <script>
        // Apply the saved theme/language before the first paint to avoid a flash (global.js handles the rest).
        (function () {
            var root = document.documentElement;
            try {
                var theme = localStorage.getItem('bdl-theme');
                root.dataset.theme = theme === 'light' || theme === 'dark' ? theme
                    : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                if (localStorage.getItem('bdl-language') === 'bg') {
                    root.lang = 'bg';
                    root.dataset.language = 'bg';
                    root.dataset.i18nPending = '';
                    setTimeout(function () { delete root.dataset.i18nPending; }, 1500);
                }
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://bulgarian-demonlist-default-rtdb.europe-west1.firebasedatabase.app">
    <link rel="preconnect" href="https://img.youtube.com">
    <link rel="modulepreload" href="scripts/app-common.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/roulette.css">
    <script src="scripts/global.js" type="module"></script>
    <script src="scripts/roulette.js" type="module"></script>
    <script src="https://kit.fontawesome.com/811caf8c84.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h3 id="logo"><a href="/">BGDL</a></h3>
        <nav>
            <ul id="nav_links">
                <li><a href="roulette.html">Roulette</a></li>
                <li><a href="leaderboard.html">Leaderboard</a></li>
                <li><a href="guidelines.html">Guidelines</a></li>
            </ul>
        </nav>
    </header>

    <section id="roulette-container">
        <div id="start-screen" class="roulette-card">
            <h1>Extreme Demon Roulette</h1>
            <p class="roulette-subtitle">Play through randomized extreme demons with progressive percentage requirements (1% to 100%).</p>
            <div class="start-actions">
                <button id="start-btn" type="button" disabled>Loading Levels...</button>
                <div class="load-controls">
                    <input type="file" id="load-file-input" accept=".json" style="display: none;">
                    <button id="load-btn" type="button" disabled><i class="fa-solid fa-folder-open" aria-hidden="true"></i> Load Save File</button>
                </div>
            </div>
        </div>

        <div id="game-screen" class="hide">
            <div class="status-bar">
                <div class="status-item">Round: <span id="round-count">1</span></div>
                <div class="status-item">Requirement: <span id="current-req">1%</span></div>
            </div>

            <div id="active-level-container"></div>

            <div class="input-area roulette-card">
                <label for="percent-input">Percentage Achieved:</label>
                <div class="input-group">
                    <input type="number" id="percent-input" min="0" max="100" placeholder="%" autocomplete="off">
                    <button id="submit-btn" type="button">NEXT <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
                </div>
                
                <div class="game-actions">
                    <button id="save-btn" type="button"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Save Game</button>
                    <button id="give-up-btn" type="button"><i class="fa-solid fa-flag" aria-hidden="true"></i> Give Up</button>
                </div>
            </div>
        </div>

        <div id="summary-screen" class="hide roulette-card">
            <div id="summary-header">
                <h2 id="summary-title">Run Summary</h2>
                <p id="summary-subtitle">Here are the results of your roulette run.</p>
                <div class="summary-actions">
                    <button id="restart-btn" type="button"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i> Start New Roulette</button>
                </div>
            </div>
            <div id="summary-sections">
                <div id="summary-history-container">
                    <h3 id="summary-history-title">Run History</h3>
                    <div id="summary-history-list" class="roulette-levels-list"></div>
                </div>
                <div id="summary-remaining-container">
                    <h3 id="summary-remaining-title">Remaining Levels</h3>
                    <div id="summary-remaining-list" class="roulette-levels-list"></div>
                </div>
            </div>
        </div>

        <div id="results-section" class="hide">
            <h3>Run History</h3>
            <div id="results-list" class="roulette-levels-list"></div>
        </div>
    </section>
</body>
</html>
