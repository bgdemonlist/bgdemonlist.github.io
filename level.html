<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>BG Demon List</title>
	<script>
		// Apply the saved theme/language before the first paint to avoid a flash (global.js handles the rest).
		(function () {
			var root = document.documentElement;
			try {
				var theme = localStorage.getItem('bdl-theme');
				root.dataset.theme = theme === 'light' || theme === 'dark' ? theme
					: matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
				if (localStorage.getItem('bdl-language') === 'bg') {
					root.lang = 'bg';
					root.dataset.language = 'bg';
					root.dataset.i18nPending = '';
					setTimeout(function () { delete root.dataset.i18nPending; }, 1500);
				}
			} catch (e) {}
		})();
	</script>
	<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
	<link rel="preconnect" href="https://bulgarian-demonlist-default-rtdb.europe-west1.firebasedatabase.app">
	<link rel="preconnect" href="https://img.youtube.com">
	<link rel="modulepreload" href="scripts/app-common.js">
	<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js">
	<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js">
	<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js">
	<link rel="stylesheet" href="css/levels.css">
	<link rel="stylesheet" href="css/global.css">
	<script src="scripts/global.js" type="module"></script>
	<script src="scripts/levels.js" type="module"></script>
	<script src="https://kit.fontawesome.com/811caf8c84.js" crossorigin="anonymous"></script>
</head>
<body>
	<div id="black-screen">
		<div id="add-popup">
			<div id="add-popup-top">
				<h1>Add Record</h1>
				<i class="fa-solid fa-x" id="add-popup-close"></i>
			</div>
			<form id="add-popup-bottom">
				<input id="add-popup-name" placeholder="Holder Name...">
				<input id="add-popup-video" placeholder="Video Link...">
				<label class="popup-checkbox-row">
					<input type="checkbox" id="add-popup-first">
					<span>First Victor</span>
				</label>
				<button>Submit</button>
			</form>
		</div>

		<div id="edit-popup">
			<div id="edit-popup-top">
				<h1>Edit Level</h1>
				<i class="fa-solid fa-x" id="edit-popup-close"></i>
			</div>
			<form id="edit-popup-bottom">
				<input id="edit-popup-name" placeholder="Level Name...">
				<input id="edit-popup-creator" placeholder="Creator Name...">
				<input id="edit-popup-video" placeholder="Video Link...">
				<div class="popup-field-group">
					<label for="edit-popup-first-victor">First Victor</label>
					<select id="edit-popup-first-victor"></select>
				</div>
				<button>Save</button>
			</form>
		</div>
	</div>

	<header>
		<h3 id="logo"><a href="/">BGDL</a></h3>
		<nav>
			<ul id="nav_links">
				<li><a href="roulette.html">Roulette</a></li>
				<li><a href="leaderboard.html">Leaderboard</a></li>
				<li><a href="guidelines.html">Guidelines</a></li>
			</ul>
		</nav>
	</header>
	<section id="level-section">
		<div class="container" id="level-info-panel">
			<div id="level-header">
				<a id="prev-level-btn" class="level-nav-arrow hide" aria-label="Previous level"><i class="fa-solid fa-chevron-left"></i></a>
				<h2 class="titles" id="levelName"></h2>
				<a id="next-level-btn" class="level-nav-arrow hide" aria-label="Next level"><i class="fa-solid fa-chevron-right"></i></a>
				<i class="fa-solid fa-pen admin-only" id="edit-level-btn" style="display: none;"></i>
			</div>
			<p class="sub-title" id="levelCreator"></p>
			<div id="level-video"></div>
			<div id="level-score-box">
				<h3 id="score-text">Points on completion:</h3>
				<p id="score"></p>
			</div>
		</div>
		<div class="container" id="level-records-panel">
			<h2 class="titles">Victors</h2>
			<div id="add-remove-div" class="admin-only" style="display: none;">
				<i class="fa-solid fa-plus" id="plus"></i>
			</div>
			<p class="sub-title" id="victor-count"></p>
			<ul id="victors-container"></ul>
		</div>
	</section>
</body>
</html>
